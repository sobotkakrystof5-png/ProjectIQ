<!-- Šablona „Magic Link" pro Supabase Auth (Authentication → Emails → Templates), R-154.
     Předmět: Kód pro přihlášení do ZakazIQ
     Vložit celý obsah pod tímto komentářem. {{ .Token }} a {{ .ConfirmationURL }} doplní Supabase.
     Při vkládání přes schránku dát diakritiku jako HTML entity, jinak se rozbije kódování. -->
<div style="margin:0;padding:24px 16px;background:#f4f6fa;font-family:Arial,Helvetica,sans-serif;color:#1c2540;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;">
    <tr>
      <td style="padding:32px 28px;">
        <p style="margin:0 0 16px;font-size:18px;font-weight:bold;">Kód pro přihlášení do ZakazIQ</p>
        <p style="margin:0 0 12px;font-size:15px;line-height:1.5;">Opište tento kód do ZakazIQ:</p>
        <p style="margin:0 0 24px;font-family:'Courier New',Courier,monospace;font-size:30px;font-weight:bold;letter-spacing:6px;">{{ .Token }}</p>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.5;">
          Nebo se přihlaste tlačítkem, kód pak opisovat nemusíte.
        </p>
        <p style="margin:0 0 24px;">
          <a href="{{ .ConfirmationURL }}"
             style="display:inline-block;padding:14px 24px;background:#1f3a8a;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:bold;">
            Přihlásit se
          </a>
        </p>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#5b6477;">
          Kód i tlačítko platí jen chvíli a jdou použít jednou. Pokud jste se nepřihlašovali, tento e-mail ignorujte, nic se nestane.
        </p>
      </td>
    </tr>
  </table>
</div>
