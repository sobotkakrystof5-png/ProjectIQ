<!-- Supabase → Authentication → Emails → Templates. Odkaz vede přes /auth/callback (R-080). -->
<div style="margin:0;padding:24px 12px;background:#f4f6fb;font-family:'Instrument Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#0c1a36">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #dfe5f1;border-radius:16px;padding:32px 28px">
    <p style="margin:0 0 20px;font-size:15px;font-weight:600;color:#23478b">ZakazIQ</p>
    <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:600">Potvrďte nový e-mail</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#3d4a66">Kliknutím potvrdíte, že se k účtu budete přihlašovat adresou {{ .NewEmail }}.</p>
    <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email_change" style="display:inline-block;background:#23478b;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 22px;border-radius:999px">Potvrdit nový e-mail</a>
    <p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#6b7690">Změnu jste nežádali? Napište nám to prosím co nejdřív.</p>
  </div>
</div>
