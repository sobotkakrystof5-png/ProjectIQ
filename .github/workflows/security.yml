# Bezpečnostní kontrola: audit závislostí, hledání secrets v historii,
# hlavičky živého webu. Stav a výjimky: .claude/security/STATE.md.

name: security

on:
  push:
    branches: [main, workspace, 'ws/**']
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # pondělí ráno — nově zveřejněné CVE

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Dev závislosti se k uživatelům nedostanou.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # celá historie — smazaný klíč v historii pořád uniká
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  headers:
    # Má smysl až s živou adresou — proměnná repa SITE_URL (Settings → Variables).
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash .claude/security/security-check.sh "${{ vars.SITE_URL }}"
